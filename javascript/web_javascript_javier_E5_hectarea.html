<html>
<head>
<title> hectarias a m cuadrados </title>

<style>
h1 {color: red;}
</style>
</head>
<body>
<script>
//Defino variables
let factor_1;

let multiplicacion;

//Pido valores al usuario

factor_1=prompt(" Dame los hectarias que quieres pasar a m cuadrados");

//Convierto en Floats
factor_1=parseFloat(factor_1);


//Hago las operaciones que me de la gana
multiplicacion=factor_1 * 10000;

alert("Esta es la cantidad de m cuadrados: " + multiplicacion + "Espero que hayas aprendido");

document.write("<h1>El resultado de m cuadrados es: " + multiplicacion + "</h1>");


</script>

<body>

</html>
