<body>
<script>
//Defino variables
let factor_1;
let factor_2;
let multiplicacion;

//Pido valores al usuario

factor_1=prompt(" Dame lo que mide el radio");
factor_2=prompt(" Dame lo que mide la altura");

//Convierto en Floats
factor_1=parseFloat(factor_1);
factor_2=parseFloat(factor_2);

//Hago las operaciones que me de la gana
multiplicacion=factor_1 * factor_1 * factor_2 * PI;

alert("El resultado del volumen es: " + multiplicacion + "Espero que hayas aprendido");

document.write("<h1>El resultado del volumen es: " + multiplicacion + "</h1>");


</script>
