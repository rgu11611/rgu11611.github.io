
<html>
<head>
<title> pulgadas a cm </title>

<style>
h1 {color: red;}
</style>
</head>
<body>
<script>
//Defino variables
let factor_1;

let multiplicacion;

//Pido valores al usuario

factor_1=prompt(" Dame las pulgadas que quieres pasar a cm");

//Convierto en Floats
factor_1=parseFloat(factor_1);


//Hago las operaciones que me de la gana
multiplicacion=factor_1 * 2,54;

alert("Esta es la cantidad en cm: " + multiplicacion + "Espero que hayas aprendido");

document.write("<h1>El resultado de cm es: " + multiplicacion + "</h1>");


</script>
