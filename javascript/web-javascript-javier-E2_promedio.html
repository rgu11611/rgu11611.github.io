<html>


<head>


<title>Promedio</title>

</head>

<body>

<script>


//DEFINO VARIABLES//


let numero_1;

let numero_2;

let numero_3;

let promedio;




//PIDO VALORES AL USUSARIO//


numero_1=prompt("Dame un número cualquiera");

numero_2=prompt("Dame otro número cualquiera");

numero_3=prompt("Dame un último número cualquiera");





//COMBIERTO EN FLOAT//


numero_1=parseFloat(numero_1);

numero_2=parseFloat(numero_2);

numero_3=parseFloat(numero_3);





//HAGO LA OPERACION QUE ME DA LA GANA//


promedio=(numero_1 + numero_2 + numero_3)/3;




alert("El resultado del promedio es: " + promedio);


document.write("<h1>El resultado de tu promedio es: " + promedio + "</h1>");


</script>

</body>


</html>
