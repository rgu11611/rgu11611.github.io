h1 {color: red;}

<body>
<script>
//Defino variables
let factor_1;

let multiplicacion;

//Pido valores al usuario

factor_1=prompt(" Dame lo que mide un lado");

//Convierto en Floats
factor_1=parseFloat(factor_1);


//Hago las operaciones que me de la gana
multiplicacion=factor_1 * factor_1 * factor_1;

alert("El area es: " + multiplicacion + "Espero que hayas aprendido");

document.write("<h1>El resultado de el area es: " + multiplicacion + "</h1>");


</script>
