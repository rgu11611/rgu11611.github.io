<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitación Cúbica 3D con color crema y bordes negros</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/PointerLockControls.js"></script>
    <script>
        // Crear la escena
        const scene = new THREE.Scene();

        // Crear la cámara
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 50);  // Colocamos la cámara a una distancia mayor para una habitación más grande

        // Crear el renderizador
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Material para las paredes (color crema)
        const creamMaterial = new THREE.MeshBasicMaterial({ color: 0xf5f5dc, side: THREE.DoubleSide });

        // Material para los bordes (negro)
        const borderMaterial = new THREE.LineBasicMaterial({ color: 0x000000 });

        // Función para crear las paredes de la habitación con bordes negros
        function createWallWithBorder(width, height, x, y, z, rotationX = 0, rotationY = 0, rotationZ = 0) {
            // Crear la pared
            const geometry = new THREE.PlaneGeometry(width, height);
            const wall = new THREE.Mesh(geometry, creamMaterial);

            // Posicionamos y rotamos la pared
            wall.position.set(x, y, z);
            wall.rotation.set(rotationX, rotationY, rotationZ);

            scene.add(wall); // Añadir la pared a la escena

            // Crear el borde negro alrededor de la pared
            const borderGeometry = new THREE.EdgesGeometry(geometry); // Creamos los bordes de la pared
            const border = new THREE.LineSegments(borderGeometry, borderMaterial);
            border.position.set(x, y, z); // Alineamos el borde con la pared
            border.rotation.set(rotationX, rotationY, rotationZ); // Alineamos el borde con la pared
            scene.add(border); // Añadir el borde a la escena
        }

        // Crear las paredes de la habitación con bordes (aumentamos el tamaño de la habitación)
        createWallWithBorder(100, 100, 0, 0, -50, 0, Math.PI, 0); // Pared de atrás
        createWallWithBorder(100, 100, 0, 0, 50, 0, 0, 0); // Pared de frente
        createWallWithBorder(100, 100, -50, 0, 0, 0, Math.PI / 2, 0); // Pared izquierda
        createWallWithBorder(100, 100, 50, 0, 0, 0, -Math.PI / 2, 0); // Pared derecha
        createWallWithBorder(100, 1, 0, 50, 0, Math.PI / 2, 0, 0); // Techo
        createWallWithBorder(100, 1, 0, -50, 0, -Math.PI / 2, 0, 0); // Piso

        // Crear controles para el movimiento y rotación de la cámara con el ratón
        const controls = new THREE.PointerLockControls(camera, renderer.domElement);

        // Hacer que al hacer clic se active el control de ratón (Pointer Lock)
        document.body.addEventListener('click', () => {
            controls.lock();
        });

        // Función para limitar el movimiento de la cámara dentro de la habitación
        const LIMIT_X = 50;  // Límite en el eje X (mitad de la habitación)
        const LIMIT_Z = 50;  // Límite en el eje Z (mitad de la habitación)

        function limitMovement() {
            // Limitar el movimiento en el eje X
            if (camera.position.x > LIMIT_X) camera.position.x = LIMIT_X;
            if (camera.position.x < -LIMIT_X) camera.position.x = -LIMIT_X;

            // Limitar el movimiento en el eje Z
            if (camera.position.z > LIMIT_Z) camera.position.z = LIMIT_Z;
            if (camera.position.z < 0) camera.position.z = 0;  // No permitir que se mueva hacia atrás del fondo
        }

        // Función de animación
        function animate() {
            requestAnimationFrame(animate);

            // Actualizar los controles de la cámara (con la rotación del ratón)
            controls.update();

            // Llamamos a la función para limitar el movimiento
            limitMovement();

            // Renderizamos la escena
            renderer.render(scene, camera);
        }

        // Llamamos a la animación
        animate();
    </script>
</body>
</html>
