<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Habitación Cúbica 3D con límites de movimiento</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
    </style>
</head>
<body>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.132.2/examples/js/controls/FirstPersonControls.js"></script>
    <script>
        // Crear la escena
        const scene = new THREE.Scene();

        // Crear la cámara
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 10);  // Colocamos la cámara al fondo de la habitación

        // Crear el renderizador
        const renderer = new THREE.WebGLRenderer();
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Material para las paredes (color y un poco de transparencia)
        const wallMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, side: THREE.DoubleSide });

        // Función para crear las paredes de la habitación
        function createWall(width, height, x, y, z, rotationX = 0, rotationY = 0, rotationZ = 0) {
            const geometry = new THREE.PlaneGeometry(width, height);
            const wall = new THREE.Mesh(geometry, wallMaterial);

            // Posicionamos y rotamos la pared
            wall.position.set(x, y, z);
            wall.rotation.set(rotationX, rotationY, rotationZ);

            scene.add(wall); // Añadir la pared a la escena
        }

        // Crear las paredes de la habitación (frente, atrás, izquierda, derecha, arriba, abajo)
        createWall(20, 20, 0, 0, -10, 0, Math.PI, 0); // Pared de atrás
        createWall(20, 20, 0, 0, 10, 0, 0, 0); // Pared de frente
        createWall(20, 20, -10, 0, 0, 0, Math.PI / 2, 0); // Pared izquierda
        createWall(20, 20, 10, 0, 0, 0, -Math.PI / 2, 0); // Pared derecha
        createWall(20, 0.5, 0, 10, 0, Math.PI / 2, 0, 0); // Techo
        createWall(20, 0.5, 0, -10, 0, -Math.PI / 2, 0, 0); // Piso

        // Crear controles para el movimiento y rotación de la cámara
        const controls = new THREE.FirstPersonControls(camera, renderer.domElement);
        controls.lookSpeed = 0.1; // Velocidad de rotación de la cámara
        controls.movementSpeed = 10; // Velocidad de movimiento

        // Limitar el movimiento de la cámara dentro de la mitad de la habitación
        const LIMIT_X = 10;  // Límite en el eje X (mitad de la habitación)
        const LIMIT_Z = 10;  // Límite en el eje Z (mitad de la habitación)
        
        function limitMovement() {
            // Limitar el movimiento en el eje X (debe estar entre -LIMIT_X y LIMIT_X)
            if (camera.position.x > LIMIT_X) camera.position.x = LIMIT_X;
            if (camera.position.x < -LIMIT_X) camera.position.x = -LIMIT_X;

            // Limitar el movimiento en el eje Z (debe estar entre -LIMIT_Z y LIMIT_Z)
            if (camera.position.z > LIMIT_Z) camera.position.z = LIMIT_Z;
            if (camera.position.z < 0) camera.position.z = 0;  // No permitir que se mueva hacia atrás del fondo
        }

        // Función de animación
        function animate() {
            requestAnimationFrame(animate);

            // Actualizar los controles
            controls.update(0.1);

            // Llamamos a la función para limitar el movimiento
            limitMovement();

            // Renderizamos la escena
            renderer.render(scene, camera);
        }

        // Llamamos a la animación
        animate();
    </script>
</body>
</html>

</body>
</html>
