
<html>
<head>
<title> División </title>

<style>
h1 {color: red;}
</style>
</head>
<body>
<script>
//Defino variables
let dividendo;
let divisor;
let division;

//Pido valores al usuario

dividendo=prompt(" Dame un dividendo cualquiera");
divisor=prompt(" Dame un divisor");

//Convierto en Floats
dividendo=parseFloat(dividendo);
divisor=parseFloat(divisor);

//Hago las operaciones que me de la gana
division=dividendo / divisor;

alert("El resultado de la división es: " + division + "Espero que hayas aprendido");

document.write("<h1>El resultado de la división es: " + division + "</h1>");


</script>

<body>

</html>
