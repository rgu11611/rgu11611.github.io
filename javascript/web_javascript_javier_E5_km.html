<html>
<head>
<title> Km a m </title>

<style>
h1 {color: red;}
</style>
</head>
<body>
<script>
//Defino variables
let factor_1;

let multiplicacion;

//Pido valores al usuario

factor_1=prompt(" Dame los km que quieres pasar a m");

//Convierto en Floats
factor_1=parseFloat(factor_1);


//Hago las operaciones que me de la gana
multiplicacion=factor_1 * 1000;

alert("Esta es la cantidad de m: " + multiplicacion + "Espero que hayas aprendido");

document.write("<h1>El resultado de m es: " + multiplicacion + "</h1>");


</script>
