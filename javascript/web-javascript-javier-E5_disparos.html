<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CS2 Aim Trainer</title>

<style>

body{
  margin:0;
  background:#0f0f0f;
  color:white;
  font-family:Arial;
  cursor:none;
  overflow:hidden;
}

#hud{
  position:fixed;
  top:10px;
  left:10px;
  font-size:18px;
  line-height:26px;
  z-index:10;
}

#world{
  position:absolute;
  width:4000px;
  height:4000px;
  background-color: lightblue; /* Suelo azul claro */
  z-index:1;
}

.target{
  position:absolute;
  width:60px;
  height:60px;
  border-radius:50%;
  background:#ff2b2b;
  box-shadow:0 0 12px red;
}

.head{
  position:absolute;
  width:24px;
  height:24px;
  border-radius:50%;
  background:yellow;
  top:18px;
  left:18px;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:26px;
  height:26px;
  transform:translate(-50%,-50%);
  pointer-events:none;
  z-index:20;
}

.line{
  position:absolute;
  background:white;
}

#v{
  width:2px;
  height:26px;
  left:12px;
}

#h{
  height:2px;
  width:26px;
  top:12px;
}

</style>
</head>

<body>

<div id="hud">
Puntos: <span id="score">0</span><br>
Disparos: <span id="shots">0</span><br>
Precisión: <span id="accuracy">0%</span><br>
Tiempo: <span id="time">45</span>
</div>

<div id="world"></div>

<div id="crosshair">
  <div class="line" id="v"></div>
  <div class="line" id="h"></div>
</div>

<script>

let score = 0
let shots = 0
let hits = 0
let time = 45
let running = true

const world = document.getElementById("world")

const scoreEl = document.getElementById("score")
const shotsEl = document.getElementById("shots")
const accEl = document.getElementById("accuracy")
const timeEl = document.getElementById("time")

let camX = 2000
let camY = 2000

// Limitar movimiento del ratón al interior de la ventana
document.addEventListener("mousemove", e => {
  // Obtener la posición del ratón dentro de la ventana
  let newX = e.clientX
  let newY = e.clientY

  // Ajustar las coordenadas de la cámara
  camX += (newX - window.innerWidth / 2) * -0.1
  camY += (newY - window.innerHeight / 2) * -0.1

  // Mantener la cámara centrada y limitar el movimiento de la "escena"
  world.style.transform = `translate(${-camX + window.innerWidth / 2}px, ${-camY + window.innerHeight / 2}px)`

  // Limitar la posición del cursor para que no salga de la página
  const minX = 0
  const maxX = window.innerWidth
  const minY = 0
  const maxY = window.innerHeight

  // Restringir el movimiento del mouse dentro de la ventana
  if (newX < minX) newX = minX
  if (newX > maxX) newX = maxX
  if (newY < minY) newY = minY
  if (newY > maxY) newY = maxY
})

// Crear targets
function spawnTarget() {

  if (!running) return

  const t = document.createElement("div")
  t.className = "target"

  const head = document.createElement("div")
  head.className = "head"

  t.appendChild(head)

  const x = Math.random() * 3800
  const y = Math.random() * 3800

  t.style.left = x + "px"
  t.style.top = y + "px"

  world.appendChild(t)

  head.onclick = (e) => {
    e.stopPropagation()

    score += 2
    hits++
    shots++

    updateStats()

    t.remove()
    spawnTarget()
  }

  t.onclick = () => {
    score++
    hits++
    shots++

    updateStats()

    t.remove()
    spawnTarget()
  }
}

document.body.onclick = e => {
  if (!e.target.classList.contains("target") && !e.target.classList.contains("head")) {

    shots++
    updateStats()

  }
}

function updateStats() {

  scoreEl.textContent = score
  shotsEl.textContent = shots

  let acc = shots ? Math.round((hits / shots) * 100) : 0
  accEl.textContent = acc + "%"

}

function timer() {

  const t = setInterval(() => {

    time--
    timeEl.textContent = time

    if (time <= 0) {

      running = false
      clearInterval(t)

      alert(
        "FIN\n\n" +
        "Puntos: " + score + "\n" +
        "Disparos: " + shots + "\n" +
        "Precisión: " + accEl.textContent
      )

    }

  }, 1000)

}

for (let i = 0; i < 6; i++) spawnTarget()

timer()

</script>

</body>
</html>
