<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>CSGO Aim Trainer</title>

<style>

body{
margin:0;
background:#111;
color:white;
font-family:Arial;
cursor:none;
overflow:hidden;
}

#hud{
position:fixed;
top:10px;
left:10px;
font-size:20px;
}

#target{
position:absolute;
width:60px;
height:60px;
border-radius:50%;
background:red;
display:none;
}

#crosshair{
position:fixed;
width:20px;
height:20px;
pointer-events:none;
}

.line{
position:absolute;
background:white;
}

#v{
width:2px;
height:20px;
left:9px;
}

#h{
height:2px;
width:20px;
top:9px;
}

</style>
</head>

<body>

<div id="hud">
Puntos: <span id="score">0</span> |
Tiempo: <span id="time">30</span>
</div>

<div id="target"></div>

<div id="crosshair">
<div class="line" id="v"></div>
<div class="line" id="h"></div>
</div>

<script>

let score = 0
let time = 30
let running = true

const target = document.getElementById("target")
const crosshair = document.getElementById("crosshair")
const scoreEl = document.getElementById("score")
const timeEl = document.getElementById("time")

// mover mira con el mouse
document.addEventListener("mousemove", e =>{

crosshair.style.left = (e.clientX - 10) + "px"
crosshair.style.top = (e.clientY - 10) + "px"

})

function spawnTarget(){

if(!running) return

const size = 40 + Math.random()*40

const x = Math.random()*(window.innerWidth-size)
const y = Math.random()*(window.innerHeight-size)

target.style.width = size+"px"
target.style.height = size+"px"

target.style.left = x+"px"
target.style.top = y+"px"

target.style.display = "block"

}

target.onclick = ()=>{

if(!running) return

score++
scoreEl.textContent = score

target.style.display="none"

setTimeout(spawnTarget,200)

}

document.body.onclick = e =>{

if(e.target !== target){
score = Math.max(0, score-1)
scoreEl.textContent = score
}

}

function startTimer(){

const t = setInterval(()=>{

time--
timeEl.textContent = time

if(time<=0){

running=false
target.style.display="none"
clearInterval(t)

setTimeout(()=>{
alert("Tiempo terminado\nPuntos: "+score)
},100)

}

},1000)

}

spawnTarget()
startTimer()

</script>

</body>
</html>
