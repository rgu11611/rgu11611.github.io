<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini FPS tipo CSGO</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
display:block;
}

#hud{
position:fixed;
top:10px;
left:10px;
color:white;
font-size:18px;
z-index:2;
}

#crosshair{
position:fixed;
top:50%;
left:50%;
width:20px;
height:20px;
margin-left:-10px;
margin-top:-10px;
pointer-events:none;
z-index:2;
}

#crosshair::before,#crosshair::after{
content:"";
position:absolute;
background:white;
}

#crosshair::before{
width:2px;
height:20px;
left:9px;
}

#crosshair::after{
height:2px;
width:20px;
top:9px;
}

#start{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:28px;
}
</style>
</head>

<body>

<div id="hud">
Puntos: <span id="score">0</span> |
Vida: <span id="hp">100</span>
</div>

<div id="crosshair"></div>
<div id="start">Haz click para jugar</div>
<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

canvas.width = innerWidth
canvas.height = innerHeight

const scoreEl = document.getElementById("score")
const hpEl = document.getElementById("hp")
const start = document.getElementById("start")

let score = 0
let hp = 100

const player={
x:0,
y:0,
angle:0,
speed:0.12
}

let keys={}

document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true)
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false)

canvas.onclick=()=>{
canvas.requestPointerLock()
start.style.display="none"
}

document.addEventListener("mousemove",e=>{
if(document.pointerLockElement===canvas){
player.angle += e.movementX*0.002
}
})

class Enemy{

constructor(){
this.respawn()
}

respawn(){
this.x=(Math.random()-0.5)*20
this.y=(Math.random()-0.5)*20
this.vx=(Math.random()-0.5)*0.02
this.vy=(Math.random()-0.5)*0.02
}

update(){

this.x+=this.vx
this.y+=this.vy

let dx=this.x-player.x
let dy=this.y-player.y

let dist=Math.sqrt(dx*dx+dy*dy)

if(dist<1.5){
hp-=0.1
hpEl.textContent=Math.floor(hp)
}

}

draw(){

let dx=this.x-player.x
let dy=this.y-player.y

let angle=Math.atan2(dy,dx)-player.angle

let dist=Math.sqrt(dx*dx+dy*dy)

let size=500/dist

let sx=canvas.width/2 + Math.tan(angle)*600

let sy=canvas.height/2

ctx.fillStyle="red"
ctx.beginPath()
ctx.arc(sx,sy,size,0,Math.PI*2)
ctx.fill()

this.screenX=sx
this.screenY=sy
this.size=size

}

}

let enemies=[]
for(let i=0;i<8;i++) enemies.push(new Enemy())

function shoot(){

let cx=canvas.width/2
let cy=canvas.height/2

enemies.forEach(e=>{

let dx=e.screenX-cx
let dy=e.screenY-cy

if(Math.sqrt(dx*dx+dy*dy)<e.size){

score++
scoreEl.textContent=score
e.respawn()

}

})

}

document.addEventListener("click",shoot)

function move(){

if(keys["w"]){
player.x+=Math.cos(player.angle)*player.speed
player.y+=Math.sin(player.angle)*player.speed
}

if(keys["s"]){
player.x-=Math.cos(player.angle)*player.speed
player.y-=Math.sin(player.angle)*player.speed
}

if(keys["a"]){
player.x+=Math.cos(player.angle-Math.PI/2)*player.speed
player.y+=Math.sin(player.angle-Math.PI/2)*player.speed
}

if(keys["d"]){
player.x+=Math.cos(player.angle+Math.PI/2)*player.speed
player.y+=Math.sin(player.angle+Math.PI/2)*player.speed
}

}

function drawWorld(){

ctx.fillStyle="#222"
ctx.fillRect(0,0,canvas.width,canvas.height/2)

ctx.fillStyle="#111"
ctx.fillRect(0,canvas.height/2,canvas.width,canvas.height)

}

function loop(){

move()

drawWorld()

enemies.forEach(e=>{
e.update()
e.draw()
})

if(hp<=0){
alert("Game Over\nPuntos: "+score)
location.reload()
}

requestAnimationFrame(loop)

}

loop()

</script>

</body>
</html>
