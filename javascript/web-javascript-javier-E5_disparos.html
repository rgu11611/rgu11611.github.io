<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>FPS Aim Trainer</title>

<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial}
canvas{display:block}

#hud{
position:fixed;
top:10px;
left:10px;
color:white;
font-size:18px;
}

#crosshair{
position:fixed;
top:50%;
left:50%;
width:18px;
height:18px;
margin-left:-9px;
margin-top:-9px;
pointer-events:none;
}

#crosshair:before,#crosshair:after{
content:"";
position:absolute;
background:white;
}

#crosshair:before{width:2px;height:18px;left:8px}
#crosshair:after{height:2px;width:18px;top:8px}

#start{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:30px;
}
</style>
</head>

<body>

<div id="hud">Puntos: <span id="score">0</span></div>
<div id="crosshair"></div>
<div id="start">Click para jugar</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

canvas.width=innerWidth
canvas.height=innerHeight

const scoreEl=document.getElementById("score")
const start=document.getElementById("start")

let score=0
let recoil=0

const player={
x:0,
y:1.6,
z:0,
yaw:0,
pitch:0,
speed:0.15
}

let keys={}

document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true)
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false)

canvas.onclick=()=>{
canvas.requestPointerLock()
start.style.display="none"
}

document.addEventListener("mousemove",e=>{

if(document.pointerLockElement===canvas){

player.yaw += e.movementX*0.002
player.pitch -= e.movementY*0.002

player.pitch -= recoil
recoil *= 0.85

player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch))

}

})

class Target{

constructor(){
this.reset()
}

reset(){
this.x=(Math.random()-0.5)*6
this.y=Math.random()*3+1
this.vx=(Math.random()-0.5)*0.03
}

update(){
this.x+=this.vx
if(this.x>3||this.x<-3) this.vx*=-1
}

draw(){

const wallZ=10

let dx=this.x-player.x
let dy=this.y-player.y
let dz=wallZ-player.z

let cosY=Math.cos(player.yaw)
let sinY=Math.sin(player.yaw)

let x=dx*cosY - dz*sinY
let z=dz*cosY + dx*sinY

let cosP=Math.cos(player.pitch)
let sinP=Math.sin(player.pitch)

let y=dy*cosP - z*sinP
z=z*cosP + dy*sinP

if(z<=0)return

let scale=600/z

let sx=canvas.width/2 + x*scale
let sy=canvas.height/2 - y*scale

let r=30*scale/100

this.sx=sx
this.sy=sy
this.size=r

let grad=ctx.createRadialGradient(
sx-r*0.3,
sy-r*0.3,
r*0.1,
sx,
sy,
r
)

grad.addColorStop(0,"#ffaaaa")
grad.addColorStop(1,"#aa0000")

ctx.fillStyle=grad

ctx.beginPath()
ctx.arc(sx,sy,r,0,Math.PI*2)
ctx.fill()

}

}

let targets=[]
for(let i=0;i<8;i++)targets.push(new Target())

function shoot(){

recoil+=0.02

let cx=canvas.width/2
let cy=canvas.height/2

targets.forEach(t=>{

let dx=t.sx-cx
let dy=t.sy-cy

if(Math.sqrt(dx*dx+dy*dy)<t.size){

score++
scoreEl.textContent=score
t.reset()

}

})

}

document.addEventListener("click",shoot)

function move(){

if(keys["w"]){
player.x+=Math.sin(player.yaw)*player.speed
player.z+=Math.cos(player.yaw)*player.speed
}

if(keys["s"]){
player.x-=Math.sin(player.yaw)*player.speed
player.z-=Math.cos(player.yaw)*player.speed
}

if(keys["a"]){
player.x-=Math.cos(player.yaw)*player.speed
player.z+=Math.sin(player.yaw)*player.speed
}

if(keys["d"]){
player.x+=Math.cos(player.yaw)*player.speed
player.z-=Math.sin(player.yaw)*player.speed
}

}

function drawWall(){

const wallZ=10
const width=8
const height=5

let dx=-player.x
let dy=0-player.y
let dz=wallZ-player.z

let cosY=Math.cos(player.yaw)
let sinY=Math.sin(player.yaw)

let x=dx*cosY - dz*sinY
let z=dz*cosY + dx*sinY

let cosP=Math.cos(player.pitch)
let sinP=Math.sin(player.pitch)

let y=dy*cosP - z*sinP
z=z*cosP + dy*sinP

if(z<=0)return

let scale=600/z

let sx=canvas.width/2 + x*scale
let sy=canvas.height/2 - y*scale

ctx.fillStyle="#444"

ctx.fillRect(
sx-width*scale/2,
sy-height*scale/2,
width*scale,
height*scale
)

}

function drawGun(){

let w=220
let h=120

let x=canvas.width/2-w/2
let y=canvas.height-h+20

ctx.fillStyle="#333"
ctx.fillRect(x,y,w,h)

ctx.fillStyle="#222"
ctx.fillRect(x+90,y-40,40,40)

}

function loop(){

ctx.fillStyle="#111"
ctx.fillRect(0,0,canvas.width,canvas.height)

move()

drawWall()

targets.forEach(t=>{
t.update()
t.draw()
})

drawGun()

requestAnimationFrame(loop)

}

loop()

</script>
</body>
</html>
