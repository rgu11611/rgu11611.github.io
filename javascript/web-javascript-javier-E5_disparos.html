<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Aim Trainer 3D</title>
<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial;}
#score{position:fixed;top:15px;left:15px;color:white;font-size:22px;z-index:10;}
#crosshair{position:fixed;top:50%;left:50%;width:20px;height:20px;margin-left:-10px;margin-top:-10px;pointer-events:none;}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:white;}
#crosshair:before{width:2px;height:20px;left:9px;}
#crosshair:after{height:2px;width:20px;top:9px;}
</style>
</head>
<body>
<div id="score">Score: 0</div>
<div id="crosshair"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script>
// === Scene & Renderer ===
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// Handle window resize
window.addEventListener('resize',()=> {
    camera.aspect = window.innerWidth/window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});

// === Lighting ===
scene.add(new THREE.AmbientLight(0x555555));
const light = new THREE.PointLight(0xffffff,1.5);
light.position.set(0,8,0);
scene.add(light);

// === Room ===
function createWall(w,h,d,x,y,z){
    const geo = new THREE.BoxGeometry(w,h,d);
    const mat = new THREE.MeshStandardMaterial({color:0x333333, roughness:0.7});
    const mesh = new THREE.Mesh(geo,mat);
    mesh.position.set(x,y,z);
    scene.add(mesh);
}
const roomSize = 20;
createWall(roomSize,0.5,roomSize,0,-0.25,0); // floor
createWall(roomSize,0.5,roomSize,0,6,0); // ceiling
createWall(roomSize,6,0.5,0,3,-roomSize/2); // back
createWall(roomSize,6,0.5,0,3,roomSize/2); // front
createWall(0.5,6,roomSize,-roomSize/2,3,0); // left
createWall(0.5,6,roomSize,roomSize/2,3,0); // right

// === Targets ===
const targets = [];
function spawnTarget(){
    const geo = new THREE.SphereGeometry(0.4,32,32);
    const mat = new THREE.MeshStandardMaterial({color:0xff3333,emissive:0x550000});
    const t = new THREE.Mesh(geo,mat);
    t.position.x = (Math.random()*10)-5;
    t.position.y = 1 + Math.random()*4;
    t.position.z = -9;
    t.userData.speed = (Math.random()*0.03)+0.01;
    t.userData.dir = Math.random()>0.5?1:-1;
    scene.add(t);
    targets.push(t);
}
for(let i=0;i<12;i++) spawnTarget();

// === Raycaster & Mouse ===
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2(0,0);

// === Score ===
let score = 0;
const scoreEl = document.getElementById("score");

// === Update Targets ===
function updateTargets(){
    targets.forEach(t=>{
        t.position.y += t.userData.speed * t.userData.dir;
        if(t.position.y>5 || t.position.y<1) t.userData.dir *= -1;
    });
}

// === FPS Controls ===
let yaw = 0, pitch = 0;
document.body.onclick=()=>{document.body.requestPointerLock();}
document.addEventListener("mousemove",(e)=>{
    if(document.pointerLockElement){
        yaw -= e.movementX*0.002;
        pitch -= e.movementY*0.002;
        pitch = Math.max(-1.5,Math.min(1.5,pitch));
        camera.rotation.set(pitch,yaw,0);
    }
});

// === Shoot ===
document.addEventListener("mousedown",()=>{
    raycaster.setFromCamera(mouse,camera);
    const hits = raycaster.intersectObjects(targets);
    if(hits.length>0){
        const t = hits[0].object;
        score++; 
        scoreEl.textContent="Score: "+score;
        t.position.x = (Math.random()*10)-5;
        t.position.y = 1 + Math.random()*4;
        // efecto simple: parpadeo del target
        t.material.emissive.setHex(0xffffff);
        setTimeout(()=>t.material.emissive.setHex(0x550000),100);
    }
});

// === Animate Loop ===
function animate(){
    requestAnimationFrame(animate);
    updateTargets();
    renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
