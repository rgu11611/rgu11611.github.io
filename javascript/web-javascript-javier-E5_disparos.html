<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Aim Trainer</title>

<style>
body{margin:0;overflow:hidden;background:black;font-family:Arial}
canvas{display:block}

#hud{
position:fixed;
top:10px;
left:10px;
color:white;
font-size:18px;
}

#crosshair{
position:fixed;
top:50%;
left:50%;
width:18px;
height:18px;
margin-left:-9px;
margin-top:-9px;
pointer-events:none;
}

#crosshair:before,#crosshair:after{
content:"";
position:absolute;
background:white;
}

#crosshair:before{width:2px;height:18px;left:8px}
#crosshair:after{height:2px;width:18px;top:8px}

#start{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
color:white;
font-size:30px;
}
</style>
</head>

<body>

<div id="hud">Puntos: <span id="score">0</span></div>
<div id="crosshair"></div>
<div id="start">Click para jugar</div>

<canvas id="game"></canvas>

<script>

const canvas=document.getElementById("game")
const ctx=canvas.getContext("2d")

canvas.width=innerWidth
canvas.height=innerHeight

const scoreEl=document.getElementById("score")
const start=document.getElementById("start")

let score=0

const wall={
z:9,
width:6,
height:3,
y:2
}

const player={
x:0,
y:1.6,
z:0,
yaw:0,
pitch:0,
speed:0.15
}

let keys={}
let recoil=0

document.addEventListener("keydown",e=>keys[e.key.toLowerCase()]=true)
document.addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false)

canvas.onclick=()=>{
canvas.requestPointerLock()
start.style.display="none"
}

document.addEventListener("mousemove",e=>{
if(document.pointerLockElement===canvas){

player.yaw+=e.movementX*0.002
player.pitch-=e.movementY*0.002
player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch))

}
})

function project(x,y,z){

let dx=x-player.x
let dy=y-player.y
let dz=z-player.z

let cosY=Math.cos(player.yaw)
let sinY=Math.sin(player.yaw)

let px=dx*cosY - dz*sinY
let pz=dz*cosY + dx*sinY

let cosP=Math.cos(player.pitch)
let sinP=Math.sin(player.pitch)

let py=dy*cosP - pz*sinP
pz=pz*cosP + dy*sinP

if(pz<=0)return null

let scale=600/pz

return{
x:canvas.width/2 + px*scale,
y:canvas.height/2 - py*scale,
scale:scale
}

}

class Target{

constructor(){
this.reset()
}

reset(){

const margin=0.5

this.x=(Math.random()*(wall.width-margin*2)-wall.width/2+margin)
this.y=wall.y+(Math.random()*(wall.height-margin*2)+margin)

this.vx=(Math.random()-0.5)*0.03
this.vy=(Math.random()-0.5)*0.02

}

update(){

this.x+=this.vx
this.y+=this.vy

const margin=0.5

if(this.x>wall.width/2-margin||this.x<-wall.width/2+margin) this.vx*=-1
if(this.y>wall.y+wall.height-margin||this.y<wall.y+margin) this.vy*=-1

}

draw(){

let p=project(this.x,this.y,wall.z)
if(!p)return

let r=25*p.scale/100

this.sx=p.x
this.sy=p.y
this.size=r

let grad=ctx.createRadialGradient(
p.x-r*0.4,
p.y-r*0.4,
r*0.2,
p.x,
p.y,
r
)

grad.addColorStop(0,"#ffcccc")
grad.addColorStop(1,"#aa0000")

ctx.fillStyle=grad

ctx.beginPath()
ctx.arc(p.x,p.y,r,0,Math.PI*2)
ctx.fill()

}

}

let targets=[]
for(let i=0;i<8;i++)targets.push(new Target())

function shoot(){

recoil+=0.05
player.pitch+=recoil*0.4

let cx=canvas.width/2
let cy=canvas.height/2

targets.forEach(t=>{

let dx=t.sx-cx
let dy=t.sy-cy

if(Math.sqrt(dx*dx+dy*dy)<t.size){

score++
scoreEl.textContent=score
t.reset()

}

})

}

document.addEventListener("click",shoot)

function move(){

if(keys["w"]){
player.x+=Math.sin(player.yaw)*player.speed
player.z+=Math.cos(player.yaw)*player.speed
}

if(keys["s"]){
player.x-=Math.sin(player.yaw)*player.speed
player.z-=Math.cos(player.yaw)*player.speed
}

if(keys["a"]){
player.x-=Math.cos(player.yaw)*player.speed
player.z+=Math.sin(player.yaw)*player.speed
}

if(keys["d"]){
player.x+=Math.cos(player.yaw)*player.speed
player.z-=Math.sin(player.yaw)*player.speed
}

}

function drawWall(){

let p=project(0,wall.y+wall.height/2,wall.z)
if(!p)return

let w=wall.width*p.scale
let h=wall.height*p.scale

ctx.fillStyle="#555"

let r=25

ctx.beginPath()
ctx.moveTo(p.x-w/2+r,p.y-h/2)
ctx.lineTo(p.x+w/2-r,p.y-h/2)
ctx.quadraticCurveTo(p.x+w/2,p.y-h/2,p.x+w/2,p.y-h/2+r)

ctx.lineTo(p.x+w/2,p.y+h/2-r)
ctx.quadraticCurveTo(p.x+w/2,p.y+h/2,p.x+w/2-r,p.y+h/2)

ctx.lineTo(p.x-w/2+r,p.y+h/2)
ctx.quadraticCurveTo(p.x-w/2,p.y+h/2,p.x-w/2,p.y+h/2-r)

ctx.lineTo(p.x-w/2,p.y-h/2+r)
ctx.quadraticCurveTo(p.x-w/2,p.y-h/2,p.x-w/2+r,p.y-h/2)

ctx.fill()

}

function drawFloor(){

let size=20
let step=2

ctx.fillStyle="#222"

for(let x=-size;x<size;x+=step){
for(let z=1;z<size;z+=step){

let p=project(x,0,z)
if(!p)continue

let s=step*p.scale*0.5

ctx.fillRect(p.x-s/2,p.y-s/2,s,s)

}
}

}

function loop(){

ctx.fillStyle="#111"
ctx.fillRect(0,0,canvas.width,canvas.height)

move()

drawFloor()
drawWall()

targets.forEach(t=>{
t.update()
t.draw()
})

requestAnimationFrame(loop)

}

loop()

</script>
</body>
</html>
