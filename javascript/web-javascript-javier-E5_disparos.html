<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mini FPS Shooter</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
font-family:Arial;
}

canvas{
display:block;
}

#hud{
position:fixed;
top:10px;
left:10px;
color:white;
font-size:18px;
}

#crosshair{
position:fixed;
top:50%;
left:50%;
width:20px;
height:20px;
margin-left:-10px;
margin-top:-10px;
pointer-events:none;
}

#crosshair::before,
#crosshair::after{
content:"";
position:absolute;
background:white;
}

#crosshair::before{
left:9px;
width:2px;
height:20px;
}

#crosshair::after{
top:9px;
height:2px;
width:20px;
}
</style>
</head>

<body>

<div id="hud">
Puntos: <span id="score">0</span>
</div>

<div id="crosshair"></div>
<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")
const scoreEl = document.getElementById("score")

canvas.width = window.innerWidth
canvas.height = window.innerHeight

let score = 0

let camera = {
x:0,
y:0
}

let sensitivity = 0.002

let targets = []

const targetCount = 10

for(let i=0;i<targetCount;i++){
targets.push({
x:(Math.random()-0.5)*2000,
y:(Math.random()-0.5)*2000,
vx:(Math.random()-0.5)*2,
vy:(Math.random()-0.5)*2
})
}

canvas.onclick = () => {
canvas.requestPointerLock()
}

document.addEventListener("mousemove",e=>{
if(document.pointerLockElement === canvas){
camera.x += e.movementX * sensitivity
camera.y += e.movementY * sensitivity
}
})

document.addEventListener("click",shoot)

function shoot(){

const cx = canvas.width/2
const cy = canvas.height/2

targets.forEach((t,i)=>{

let dx = t.screenX - cx
let dy = t.screenY - cy

if(Math.sqrt(dx*dx+dy*dy) < 20){

score++
scoreEl.textContent = score

targets[i] = {
x:(Math.random()-0.5)*2000,
y:(Math.random()-0.5)*2000,
vx:(Math.random()-0.5)*2,
vy:(Math.random()-0.5)*2
}

}

})

}

function update(){

targets.forEach(t=>{
t.x += t.vx
t.y += t.vy

if(Math.abs(t.x)>2000) t.vx*=-1
if(Math.abs(t.y)>2000) t.vy*=-1
})

}

function draw(){

ctx.fillStyle="black"
ctx.fillRect(0,0,canvas.width,canvas.height)

targets.forEach(t=>{

let sx = canvas.width/2 + (t.x - camera.x*500)
let sy = canvas.height/2 + (t.y - camera.y*500)

t.screenX = sx
t.screenY = sy

ctx.beginPath()
ctx.arc(sx,sy,15,0,Math.PI*2)
ctx.fillStyle="red"
ctx.fill()

})

}

function loop(){

update()
draw()
requestAnimationFrame(loop)

}

loop()

</script>

</body>
</html>
