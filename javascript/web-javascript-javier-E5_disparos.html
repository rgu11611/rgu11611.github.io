<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Aim Trainer 3D</title>

<style>

body{
margin:0;
overflow:hidden;
background:#111;
font-family:Arial;
}

#hud{
position:fixed;
top:15px;
left:20px;
color:white;
font-size:22px;
z-index:10;
}

#crosshair{
position:fixed;
top:50%;
left:50%;
width:18px;
height:18px;
margin-left:-9px;
margin-top:-9px;
pointer-events:none;
}

#crosshair:before,#crosshair:after{
content:"";
position:absolute;
background:white;
}

#crosshair:before{
width:2px;
height:18px;
left:8px;
}

#crosshair:after{
height:2px;
width:18px;
top:8px;
}

</style>
</head>
<body>

<div id="hud">Score: <span id="score">0</span></div>
<div id="crosshair"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script>

const scene = new THREE.Scene()

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
)

const renderer = new THREE.WebGLRenderer({antialias:true})

renderer.setSize(window.innerWidth,window.innerHeight)
document.body.appendChild(renderer.domElement)

camera.position.set(0,1.6,5)

let score = 0
const scoreEl = document.getElementById("score")

// luces

const light = new THREE.PointLight(0xffffff,1)
light.position.set(0,6,0)
scene.add(light)

scene.add(new THREE.AmbientLight(0x666666))

// habitación

const wallMaterial = new THREE.MeshStandardMaterial({color:0x3a3a3a})

function createWall(w,h,d,x,y,z){

const g = new THREE.BoxGeometry(w,h,d)
const m = new THREE.Mesh(g,wallMaterial)

m.position.set(x,y,z)
scene.add(m)

}

const size = 20

createWall(size,0.5,size,0,-0.25,0)   // suelo
createWall(size,0.5,size,0,5,0)       // techo

createWall(size,5,0.5,0,2.5,-size/2)
createWall(size,5,0.5,0,2.5,size/2)

createWall(0.5,5,size,-size/2,2.5,0)
createWall(0.5,5,size,size/2,2.5,0)

// targets

const targets=[]

function spawnTarget(){

const geo = new THREE.CircleGeometry(0.4,32)

const mat = new THREE.MeshBasicMaterial({
color:0xff3b3b
})

const t = new THREE.Mesh(geo,mat)

t.position.x = (Math.random()*10)-5
t.position.y = 1 + Math.random()*3
t.position.z = -9

t.userData.vy = (Math.random()-0.5)*0.05

scene.add(t)
targets.push(t)

}

for(let i=0;i<15;i++){
spawnTarget()
}

// movimiento targets

function updateTargets(){

targets.forEach(t=>{

t.position.y += t.userData.vy

if(t.position.y>4 || t.position.y<1){

t.userData.vy *= -1

}

})

}

// disparo

const raycaster = new THREE.Raycaster()

document.addEventListener("mousedown",()=>{

raycaster.setFromCamera({x:0,y:0},camera)

const hit = raycaster.intersectObjects(targets)

if(hit.length>0){

const t = hit[0].object

score++
scoreEl.textContent = score

// respawn

t.position.x = (Math.random()*10)-5
t.position.y = 1 + Math.random()*3

}

})

// control FPS

let yaw=0
let pitch=0
const sens=0.002

document.body.onclick=()=>{
document.body.requestPointerLock()
}

document.addEventListener("mousemove",e=>{

if(document.pointerLockElement){

yaw -= e.movementX*sens
pitch -= e.movementY*sens

pitch = Math.max(-1.5,Math.min(1.5,pitch))

camera.rotation.set(pitch,yaw,0)

}

})

// loop

function animate(){

requestAnimationFrame(animate)

updateTargets()

renderer.render(scene,camera)

}

animate()

</script>

</body>
</html>
