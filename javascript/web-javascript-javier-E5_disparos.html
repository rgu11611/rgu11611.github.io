}

}

}

<body>

<script>

let scene = new THREE.Scene()

let camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
)

let renderer = new THREE.WebGLRenderer({antialias:true})

renderer.setSize(window.innerWidth,window.innerHeight)

let score = 0
let scoreUI = document.getElementById("score")

const light = new THREE.PointLight(0xffffff,1.5)
light.position.set(0,8,0)
scene.add(light)

scene.add(new THREE.AmbientLight(0x444444))

function createWall(w,h,d,x,y,z){

const g = new THREE.BoxGeometry(w,h,d)

const m = new THREE.MeshStandardMaterial({
color:0x222222,
roughness:0.7
})

const mesh = new THREE.Mesh(g,m)

mesh.position.set(x,y,z)

scene.add(mesh)

}

createWall(room,6,0.5,0,3,room/2)

createWall(0.5,6,room,-room/2,3,0)

const targets = []

function spawnTarget(){

color:0xff3333,
emissive:0x550000
})

const t = new THREE.Mesh(geo,mat)

t.position.y = 1 + Math.random()*4

t.userData.speed = (Math.random()*0.03)+0.01
t.userData.dir = Math.random()>0.5?1:-1

scene.add(t)
targets.push(t)

}

for(let i=0;i<12;i++){
spawnTarget()
}

document.addEventListener("mousedown",()=>{

}

})

}
