<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Aim Trainer Habitación</title>

<style>

body{
margin:0;
overflow:hidden;
background:#111;
font-family:Arial;
}

canvas{
display:block;
}

#hud{
position:fixed;
top:15px;
left:20px;
color:white;
font-size:22px;
}

#crosshair{
position:fixed;
top:50%;
left:50%;
width:18px;
height:18px;
margin-left:-9px;
margin-top:-9px;
pointer-events:none;
}

#crosshair:before,#crosshair:after{
content:"";
position:absolute;
background:white;
}

#crosshair:before{
width:2px;
height:18px;
left:8px;
}

#crosshair:after{
height:2px;
width:18px;
top:8px;
}

</style>
</head>
<body>

<div id="hud">Puntos: <span id="score">0</span></div>

<div id="crosshair"></div>

<canvas id="game"></canvas>

<script>

const canvas = document.getElementById("game")
const ctx = canvas.getContext("2d")

canvas.width = innerWidth
canvas.height = innerHeight

const scoreEl = document.getElementById("score")

let score = 0

let player={
yaw:0,
pitch:0,
sens:0.002
}

let targets=[]
let particles=[]

const wall={
z:8,
width:8,
height:4,
y:2
}

canvas.onclick=()=>canvas.requestPointerLock()

document.addEventListener("mousemove",e=>{

if(document.pointerLockElement===canvas){

player.yaw+=e.movementX*player.sens
player.pitch-=e.movementY*player.sens

player.pitch=Math.max(-1.2,Math.min(1.2,player.pitch))

}

})

document.addEventListener("mousedown",shoot)

class Target{

constructor(){
this.reset()
}

reset(){

this.x=(Math.random()*wall.width-wall.width/2)

this.y=wall.y+Math.random()*wall.height

this.vy=(Math.random()-0.5)*0.04

}

update(){

this.y+=this.vy

if(this.y>wall.y+wall.height || this.y<wall.y){
this.vy*=-1
}

}

draw(){

let p=project(this.x,this.y,wall.z)

if(!p) return

let r=20*p.scale/100

this.sx=p.x
this.sy=p.y
this.size=r

ctx.fillStyle="#ff4444"

ctx.beginPath()
ctx.arc(p.x,p.y,r,0,Math.PI*2)
ctx.fill()

}

}

class Particle{

constructor(x,y){

this.x=x
this.y=y

this.vx=(Math.random()-0.5)*4
this.vy=(Math.random()-0.5)*4

this.life=25

}

update(){

this.x+=this.vx
this.y+=this.vy
this.life--

}

draw(){

ctx.fillStyle="orange"

ctx.beginPath()
ctx.arc(this.x,this.y,2,0,Math.PI*2)
ctx.fill()

}

}

for(let i=0;i<10;i++){
targets.push(new Target())
}

function project(x,y,z){

let dx=x
let dy=y-1.6
let dz=z

let cosY=Math.cos(player.yaw)
let sinY=Math.sin(player.yaw)

let px=dx*cosY-dz*sinY
let pz=dz*cosY+dx*sinY

let cosP=Math.cos(player.pitch)
let sinP=Math.sin(player.pitch)

let py=dy*cosP-pz*sinP
pz=pz*cosP+dy*sinP

if(pz<=0) return null

let scale=600/pz

return{
x:canvas.width/2+px*scale,
y:canvas.height/2-py*scale,
scale
}

}

function shoot(){

let cx=canvas.width/2
let cy=canvas.height/2

targets.forEach(t=>{

let dx=t.sx-cx
let dy=t.sy-cy

if(Math.sqrt(dx*dx+dy*dy)<t.size){

score++
scoreEl.textContent=score

t.reset()

for(let i=0;i<10;i++){
particles.push(new Particle(t.sx,t.sy))
}

}

})

}

function drawRoom(){

ctx.fillStyle="#333"

let scale=canvas.height/350

let w=wall.width*scale
let h=wall.height*scale

let px=canvas.width/2
let py=canvas.height/2-wall.y*60

ctx.fillRect(px-w/2,py-h/2,w,h)

}

function loop(){

ctx.fillStyle="#111"
ctx.fillRect(0,0,canvas.width,canvas.height)

drawRoom()

targets.forEach(t=>{
t.update()
t.draw()
})

particles.forEach((p,i)=>{

p.update()
p.draw()

if(p.life<=0){
particles.splice(i,1)
}

})

requestAnimationFrame(loop)

}

loop()

</script>
</body>
</html>
