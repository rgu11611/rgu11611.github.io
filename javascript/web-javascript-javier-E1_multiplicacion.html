
<html>
<head>
<title> Multiplicación </title>

<style>
h1 {color: red;}
</style>
</head>
<body>
<script>
//Defino variables
let factor_1;
let factor_2;
let multiplicacion;

//Pido valores al usuario

factor_1=prompt(" Dame un factor cualquiera");
factor_2=prompt(" Dame otro factor");

//Convierto en Floats
factor_1=parseFloat(factor_1);
factor_2=parseFloat(factor_2);

//Hago las operaciones que me de la gana
multiplicacion=factor_1 * factor_2;

alert("El resultado de la multiplicación es: " + multiplicacion + "Espero que hayas aprendido");

document.write("<h1>El resultado de la multiplicación es: " + multiplicacion + "</h1>");


</script>

<body>

</html>
